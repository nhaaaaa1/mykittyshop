{% extends "base.html" %}

{% block content %}
<section class="products-page">
    <h2>Our Beautiful Collection</h2>
    <div class="products-grid">
        {% for flower in flowers %}
        <div class="product-card">
            <img src="{{ flower.image }}" alt="{{ flower.name }}">
            <div class="product-info">
                <h4>{{ flower.name }}</h4>
                <p class="price">${{ "%.2f"|format(flower.price) }}</p>
                {% if not flower.in_stock %}
                <span class="out-of-stock">Out of Stock</span>
                {% endif %}
                <a href="{{ url_for('product_details', product_id=flower.id) }}" class="btn btn-secondary">View Details</a>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
