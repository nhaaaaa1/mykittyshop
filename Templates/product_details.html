{% extends "base.html" %}

{% block content %}
<section class="product-details">
    <div class="product-images">
        <img src="{{ flower.image }}" alt="{{ flower.name }}" class="main-image">
    </div>
    <div class="product-info">
        <h2>{{ flower.name }}</h2>
        <p class="price">${{ "%.2f"|format(flower.price) }}</p>
        <p class="description">{{ flower.description }}</p>

        <div class="details-section">
            <h4>Product Details</h4>
            <p>{{ flower.details }}</p>
        </div>

        <div class="care-section">
            <h4>Care Tips</h4>
            <p>{{ flower.care_tips }}</p>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary">
                <i class="fas fa-shopping-cart"></i> Add to Cart
            </button>
            <button class="btn btn-secondary">
                <i class="fas fa-heart"></i> Add to Wishlist
            </button>
        </div>

        {% if not flower.in_stock %}
        <div class="stock-notice">
            <i class="fas fa-clock"></i> Currently out of stock
        </div>
        {% endif %}
    </div>
</section>
{% endblock %}
